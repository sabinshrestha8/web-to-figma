<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Web to Figma</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    #page { color: GrayText; margin: 0 0 16px; overflow-wrap: anywhere; }
    #actions { display: flex; gap: 8px; margin: 16px 0; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #888; cursor: pointer; }
    #download { background: #0d6efd; color: #fff; border-color: #0d6efd; }
    ul { padding: 0; list-style: none; font-size: 13px; }
    li { padding: 4px 8px; border-left: 3px solid #888; margin: 4px 0; overflow-wrap: anywhere; }
    li.fatal, li.error { border-color: #d33; }
    li.warning { border-color: #e9a100; }
  </style>
</head>
<body>
  <h1>Web to Figma</h1>
  <p id="page"></p>
  <p id="status" role="status">Loading the capture…</p>
  <div id="actions" hidden>
    <button id="download" type="button">Download .w2f.json</button>
    <button id="copy" type="button">Copy for the plugin</button>
  </div>
  <ul id="diagnostics"></ul>
  <script src="result.js"></script>
</body>
</html>
